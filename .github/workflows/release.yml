name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: ['10.10', '10.11', '12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore SmokeTests/SmokeTests.csproj --configfile NuGet.Config -p:JellyfinAbi=${{ matrix.abi }}
      - name: Smoke tests
        run: dotnet run --project SmokeTests/SmokeTests.csproj -c Release --no-restore -p:JellyfinAbi=${{ matrix.abi }}
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -JellyfinAbi '${{ matrix.abi }}' -NoRestore
      - uses: actions/upload-artifact@v4
        with:
          name: biliarchive-${{ matrix.abi }}
          path: |
            dist/packages/*.zip
            dist/packages/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: biliarchive-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version meta.json)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 3
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip release-assets/*.sha256 \
            --verify-tag --title "${GITHUB_REF_NAME}" --prerelease --notes-file RELEASE_NOTES.md
